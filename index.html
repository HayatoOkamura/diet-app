<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>減量プラン手帳</title>
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* VOICE everyday and calm, in the manner of Apple's Health app (the person's request)
   IDEA a health summary: grouped cards on a grey ground, each with a coloured category label and one large figure
   PICTURE weight card and checklist on 今日; a PFC donut; the training menu with templates; a weight trend line
   COLOUR grey / soft charcoal ground, white / slate cards, category colours (purple body, cyan water, green food, orange training)
   TYPE system UI stack (SF / Hiragino / Noto Sans JP), large bold titles
   LAYOUT one column up to 600px, large title header with a settings button, translucent bottom tab bar */
:root{color-scheme:light;--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mute:#6e6e73;--sep:#e3e3e8;--fill:#e8e8ed;--purple:#8e44d8;--blue:#007aff;--green:#1f9d45;--orange:#e66a00;--pink:#ff2d55;--cyan:#0a8fc2;--red:#ff3b30;--shadow:rgba(0,0,0,.16)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#121316;--card:#1d1f24;--ink:#e2e3e8;--mute:#979aa3;--sep:#30333a;--fill:#2a2d34;--purple:#b48ee0;--blue:#6ea4f0;--green:#62c48a;--orange:#e3a066;--pink:#e98399;--cyan:#73c2de;--red:#e9746c;--shadow:rgba(0,0,0,.5)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#121316;--card:#1d1f24;--ink:#e2e3e8;--mute:#979aa3;--sep:#30333a;--fill:#2a2d34;--purple:#b48ee0;--blue:#6ea4f0;--green:#62c48a;--orange:#e3a066;--pink:#e98399;--cyan:#73c2de;--red:#e9746c;--shadow:rgba(0,0,0,.5)}
body.m-light{color-scheme:light;--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mute:#6e6e73;--sep:#e3e3e8;--fill:#e8e8ed;--purple:#8e44d8;--blue:#007aff;--green:#1f9d45;--orange:#e66a00;--pink:#ff2d55;--cyan:#0a8fc2;--red:#ff3b30;--shadow:rgba(0,0,0,.16)}
body.m-dark{color-scheme:dark;--bg:#121316;--card:#1d1f24;--ink:#e2e3e8;--mute:#979aa3;--sep:#30333a;--fill:#2a2d34;--purple:#b48ee0;--blue:#6ea4f0;--green:#62c48a;--orange:#e3a066;--pink:#e98399;--cyan:#73c2de;--red:#e9746c;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.in{max-width:600px;margin:0 auto;padding:0 16px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px}
.hd small{display:block;font-size:14px;font-weight:600;color:var(--mute)}
h1{font-size:34px;line-height:1.1;margin:2px 0 0;font-weight:800;letter-spacing:.01em}
.gear{width:40px;height:40px;border-radius:20px;background:var(--fill);display:grid;place-items:center;flex:none}
.gear svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8}
.sec{font-size:22px;font-weight:800;margin:24px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec small,.sec .lnk{font-size:14px;font-weight:600;color:var(--mute)}
.sec .lnk{color:var(--blue);min-height:32px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:700}
.ch>span{display:flex;align-items:center;gap:6px}
.ch svg{width:18px;height:18px;fill:currentColor}
.ch .t{font-weight:500;color:var(--mute);font-size:14px}
.val{font-size:36px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.unit{font-size:17px;font-weight:600;color:var(--mute);margin-left:3px}
.sub{font-size:15px;color:var(--mute);margin-top:2px}
.row2{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:15px;font-weight:600;white-space:nowrap}
.pill.o{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.bl{color:var(--blue)}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.segc button{height:34px;border-radius:7px;font-size:14px;font-weight:600}
.segc button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px var(--shadow)}
.tip{font-size:15px;margin:10px 0 0;color:var(--ink)}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 16px;text-align:left;position:relative;font-size:16px}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.li .grow{flex:1}
.li .m{display:block;font-size:13px;color:var(--mute)}
.li .r{color:var(--mute);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ck{flex:none;width:26px;height:26px;border-radius:13px;border:2px solid var(--sep);display:grid;place-items:center}
[aria-pressed=true] .ck{background:var(--c,var(--green));border-color:var(--c,var(--green))}
[aria-pressed=true] .ck::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cups{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:10px}
.cups button{height:44px}
.cups svg{width:100%;height:100%}
.donut{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:12px}
.dwrap{position:relative;aspect-ratio:1;width:min(200px,60vw);margin:0 auto}
.dwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dmid b{font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.dmid span{font-size:13px;color:var(--mute)}
.leg{display:grid;gap:12px}
.leg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding-top:10px;border-top:1px solid var(--sep)}
.leg i{width:12px;height:12px;border-radius:6px;align-self:center}
.leg b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.leg span{font-size:15px}
.leg em{grid-column:2/4;font-style:normal;font-size:13px;color:var(--mute)}
.meal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.meal div{background:var(--fill);border-radius:10px;padding:10px}
.meal b{display:block;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meal span{font-size:13px;color:var(--mute)}
.tl{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:4px 12px;padding:10px 0}
.tl+.tl{border-top:1px solid var(--sep)}
.tl .tt{font-size:17px;font-weight:700;color:var(--green);white-space:nowrap}
.tl p{margin:2px 0 0;font-size:15px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips button{flex:none;min-height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:14px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.rec{background:color-mix(in srgb,var(--orange) 12%,var(--card));border-radius:14px;padding:14px 16px;margin-bottom:12px}
.rec .ch{color:var(--orange)}
.rec .sub{font-size:14px;margin:2px 0 0}
.rec ol{margin:6px 0 10px;padding-left:1.3em;font-size:15px}
.mi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:10px 8px 12px 16px;position:relative}
.mi+.mi::before{content:"";position:absolute;top:0;left:54px;right:0;border-top:1px solid var(--sep)}
.mi .nm{font-size:16px}
.mi .nm small{display:block;font-size:13px;color:var(--mute)}
.mi .nm small em{font-style:normal;color:var(--orange)}
.mi .pill{grid-column:2;grid-row:2;justify-self:start}
.mi .x{grid-column:3;grid-row:1}
.x{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--mute);font-size:20px;flex:none}
.add{flex:none;width:28px;height:28px;border-radius:14px;display:grid;place-items:center;background:var(--fill);color:var(--blue);font-size:20px;font-weight:700;line-height:1}
.add.on{background:var(--orange);color:#fff;font-size:15px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:4px;vertical-align:1px}
.empty{padding:16px;color:var(--mute);font-size:15px;text-align:center}
.gate{min-height:100vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:12px;padding:24px 16px 120px}
.gate img{width:88px;height:88px;border-radius:22px}
.gate p{margin:0;max-width:30em;color:var(--mute);font-size:15px}
.gate .sbtn{max-width:320px}
.sbtn.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-width:260px}
.gbtn svg{width:20px;height:20px;background:#fff;border-radius:10px;padding:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 0}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity;scrollbar-width:none}
.tpl{flex:none;width:168px;min-height:112px;background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;scroll-snap-align:start}
.tpl b{font-size:17px;line-height:1.3}
.tpl span{font-size:13px;color:var(--orange);font-weight:700}
.tpl em{font-style:normal;font-size:13px;color:var(--mute);line-height:1.4}
.tpl.add{align-items:center;justify-content:center;text-align:center;color:var(--blue);font-size:28px;border:2px dashed var(--sep);background:none}
.tpl.add span{color:var(--blue);font-size:14px}
.search{display:block;width:100%;height:44px;border-radius:12px;border:0;background:var(--card);padding:0 14px;font-size:16px;margin-bottom:10px}
.acc{margin-bottom:8px}
.acch{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:0 16px;background:var(--card);border-radius:14px;font-size:17px;font-weight:700;text-align:left}
.acch small{color:var(--mute);font-weight:600;font-size:15px}
.chev{color:var(--mute);display:inline-block;transition:transform .2s;font-size:20px;width:14px;text-align:center}
.acch[aria-expanded=true] .chev{transform:rotate(90deg)}
.acc.open .acch,.acch[aria-expanded=true]{border-radius:14px 14px 0 0}
.acc .group{border-radius:0 0 14px 14px;border-top:1px solid var(--sep);margin:0}
.lr{display:flex;align-items:center;position:relative}
.lr+.lr::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:1px solid var(--sep)}
.star{flex:none;width:48px;min-height:56px;display:grid;place-items:center}
.star svg{width:20px;height:20px;fill:none;stroke:var(--mute);stroke-width:1.8;stroke-linejoin:round}
.star[aria-pressed=true] svg{fill:var(--orange);stroke:var(--orange)}
.lrb{flex:1;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px 8px 0;text-align:left;font-size:16px}
.lrb .grow{flex:1}
.lrb .m{display:block;font-size:13px;color:var(--mute)}
.fig{position:relative;height:240px;margin-top:8px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font-size:12px;fill:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats span{font-size:13px;color:var(--mute)}
.ph{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:2px 12px;padding:10px 0}
.ph+.ph{border-top:1px solid var(--sep)}
.ph b{font-size:15px}
.ph .w{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ph p{grid-column:2;margin:0;font-size:14px;color:var(--mute)}
.ph.now b,.ph.now .w{color:var(--purple)}
.warn{border-left:4px solid var(--red)}
.note{font-size:13px;color:var(--mute);margin:6px 4px 0}
.btn{display:block;width:100%;height:50px;border-radius:12px;background:var(--card);color:var(--blue);font-weight:600;font-size:17px}
.sbtn{display:block;width:100%;min-height:50px;border-radius:12px;background:var(--card);font-weight:600;font-size:17px;color:var(--blue);margin-top:8px}
.sbtn.p{background:var(--blue);color:#fff}
.sbtn.d{color:var(--red)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:16px 16px 0 0;max-width:600px;margin:0 auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease;max-height:88vh;overflow-y:auto}
#sheet.on{transform:none}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:3}
.sbar b{font-size:17px;text-align:center}
.tb{color:var(--blue);font-size:17px;min-height:44px;justify-self:start}
.tb.strong{font-weight:700;justify-self:end}
.wheels{position:relative;display:flex;justify-content:center;gap:6px;margin:8px 16px 12px;background:var(--card);border-radius:14px;padding:0 8px}
.hl{position:absolute;left:8px;right:8px;top:88px;height:44px;background:var(--fill);border-radius:10px;pointer-events:none}
.wcol{position:relative;display:flex;align-items:center;z-index:1}
.wheel{height:220px;width:4.4em;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);overscroll-behavior:contain}
.wheel::-webkit-scrollbar,.hs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.wpad{height:88px}
.opt{height:44px;display:grid;place-items:center;scroll-snap-align:center;font-size:22px;font-variant-numeric:tabular-nums;color:var(--mute);cursor:pointer}
.opt.sel{color:var(--ink);font-weight:600;font-size:24px}
.wu{font-size:17px;font-weight:600;margin-left:2px;min-width:2em}
.sbody{padding:0 16px 8px}
.sl{font-size:13px;color:var(--mute);margin:16px 16px 6px}
.li input[type=date]{border:0;background:var(--fill);border-radius:8px;height:36px;padding:0 8px;font-size:16px}
.tin{width:100%;height:40px;border:0;background:none;font-size:17px}
#st{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;z-index:30}
#st span{display:inline-block;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:16px;font-size:14px}
#st span:empty{display:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav button{height:62px;display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute)}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--blue)}
@media(max-width:380px){.meal{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){#sheet,.chev{transition:none}}
</style>
</head>
<body>
<main id="view"></main>
<div id="st"><span></span></div>
<div id="scrim" hidden data-a="sx"></div>
<div id="sheet" hidden role="dialog" aria-modal="true"></div>
<nav id="nav" aria-label="画面" hidden><div class="in">
<button data-tab="today"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>今日</button>
<button data-tab="food"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6.5 4.5"/></svg>食事</button>
<button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>筋トレ</button>
<button data-tab="log"><svg viewBox="0 0 24 24"><path d="M3 20h18M4 16l5-6 4 4 7-9"/></svg>記録</button>
</div></nav>
<script>
{
const $=s=>document.querySelector(s);
const view=$('#view'),sheet=$('#sheet'),scrim=$('#scrim'),root=document.documentElement;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=parse(s);d.setMonth(d.getMonth()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const num=v=>typeof v==='number'&&isFinite(v)?v:null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const range=(a,b,s=1)=>{const r=[];for(let v=a;v<=b+1e-9;v+=s)r.push(Math.round(v*100)/100);return r};
const today=()=>ymd(new Date());
const WD='日月火水木金土';
const fmtDate=s=>{const d=parse(s);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）'};
const short=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const f1=v=>v==null?'—':v.toFixed(1);
const sgn=v=>(v>0?'+':v<0?'−':'±')+Math.abs(v).toFixed(1);
const uid36=p=>p+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
const ICON={
body:'<svg viewBox="0 0 20 20"><circle cx="10" cy="4" r="2.6"/><path d="M5 8h10l-1.6 4.5H12V19H8v-6.5H6.6z"/></svg>',
food:'<svg viewBox="0 0 20 20"><path d="M10 4c3-2.5 7 0 7 4.5S13.5 18 10 18 3 13 3 8.5 7 1.5 10 4z"/><path d="M10 4c0-1.5 1-3 2.5-3" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>',
water:'<svg viewBox="0 0 20 20"><path d="M10 2s6 6.5 6 10.5a6 6 0 0 1-12 0C4 8.5 10 2 10 2z"/></svg>',
fire:'<svg viewBox="0 0 20 20"><path d="M10 1c1 4 5 5.5 5 10.5A5 5 0 0 1 5 11.5C5 9 6.5 7.5 7 6c.5 2 1.5 3 2.5 3C9.5 6 9 3.5 10 1z"/></svg>'};
const STAR='<svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/></svg>';
const SHIFTS={day:'日勤',night:'夜勤',after:'夜勤明け',off:'休み'};

function startUser(u){
  const em=String(u.email||'').toLowerCase();user=u;unsubs.forEach(f=>f());unsubs=[];resetData();
  if(fb.allowed.length&&!fb.allowed.includes(em)){mode='denied';render();return}

function gate(){

  if(mode==='login')return `<div class="gate">${icon}${title}<p>Googleアカウントでログインします。記録はアカウントごとに分かれ、本人しか見られません。</p><button class="sbtn p gbtn" data-a="login">${GLOGO}Googleでログイン</button>${gateMsg?`<p style="color:var(--red)">${esc(gateMsg)}</p>`:''}</div>`;

  return `<div class="gate">${icon}<p>読み込み中…</p></div>`;
}
async function boot(){
  let CFG=null;
  try{CFG=(await import('./firebase-config.js')).default}catch(e){CFG=null}
  const c=CFG&&CFG.firebase;if(!c||!c.apiKey||!c.projectId||/ここ|YOUR|xxxx/i.test(c.apiKey+c.projectId)){mode='setup';render();return}
  try{
    const [A,AU,FS]=await Promise.all([import(FBU+'firebase-app.js'),import(FBU+'firebase-auth.js'),import(FBU+'firebase-firestore.js')]);
    const app=A.initializeApp(c);const auth=AU.getAuth(app);
    let db;try{db=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})})}catch(e){db=FS.getFirestore(app)}
    fb={auth,db,AU,FS,allowed:(Array.isArray(CFG.allowedEmails)?CFG.allowedEmails:[]).map(x=>String(x).trim().toLowerCase()).filter(x=>x&&!/example|you@|partner@/.test(x))};
    AU.onAuthStateChanged(auth,u=>{if(u)startUser(u);else stopUser()});
  }catch(e){mode='neterr';render()}
}

  openSheet(`<div class="sbar"><button class="tb" data-a="sx">キャンセル</button><b>${esc(title)}</b><button class="tb strong" data-a="sok">完了</button></div><div class="wheels"><div class="hl"></div>${cols.map((c,ci)=>`<div class="wcol"><div class="wheel" tabindex="0" data-c="${ci}" role="listbox" aria-label="${esc(c.unit||title)}" style="width:${c.w||4.4}em"><div class="wpad"></div>${c.vals.map((v,i)=>`<div class="opt" data-i="${i}">${esc(c.labels?c.labels[i]:v)}</div>`).join('')}<div class="wpad"></div></div>${c.unit?`<span class="wu">${esc(c.unit)}</span>`:''}</div>`).join('')}</div>`);

function vLog(){
  const t=today(),lw=latestUpTo(t),a7=avgRange(addDays(t,-7),t),p7=avgRange(addDays(t,-14),addDays(t,-7)),pl=planAt(t),pts=planPts();
  const phases=[['1〜2ヶ月目','水分やむくみが抜けて一気に落ちる時期。食事を減らしすぎない'],['3〜4ヶ月目','必ず停滞期が来る。体重が動かなくても筋トレを続ける'],['5〜6ヶ月目','落ちにくい時期。週1回好きなものを食べる日を入れる']];
  const recent=Object.keys(days).filter(isDate).sort().reverse().slice(0,14);
  const ws=weekStart(t),wk=Object.keys(days).filter(k=>k>=ws&&k<=t),wo=wk.filter(k=>days[k].workout).length,wa=wk.length?wk.reduce((s,k)=>s+days[k].water,0)/wk.length*.25:null;
  const old=avgRange(addDays(t,-37),addDays(t,-30));
  const warn=a7!=null&&old!=null&&old-a7<1?`<div class="card warn"><b>この1ヶ月で1kg以上減っていません</b><p class="tip" style="color:var(--mute)">食事を徹底していても減らない、体調が極端に悪いときは、ホルモン異常などの可能性もあるので無理せず内科や肥満外来に相談を。</p></div>`:'';
  return `<div class="in">${head('記録',fmtDate(t))}
<div class="card"><div class="ch" style="color:var(--purple)"><span>${ICON.body}体重</span><span class="t">直近7日の平均</span></div>
<div class="row2"><div><span class="val">${f1(a7)}</span><span class="unit">kg</span><div class="sub">${lw==null?'まだ記録がありません':'開始から '+sgn(lw-S.w0)+' kg'}</div></div></div>
<div class="fig" id="fig"><svg id="chart" role="img" aria-label="体重の推移と計画"></svg></div>
<div style="display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:4px"><span><i style="display:inline-block;width:14px;height:3px;background:var(--purple);vertical-align:middle;margin-right:5px;border-radius:2px"></i>実際</span><span><i style="display:inline-block;width:14px;border-top:2px dashed var(--mute);vertical-align:middle;margin-right:5px"></i>計画（${S.w0}→${S.goal}kg）</span></div>
<div class="stats"><div><b>${f1(lw)}</b><span>最新（kg）</span></div><div><b>${a7!=null&&p7!=null?sgn(a7-p7):'—'}</b><span>前の7日との差</span></div><div><b>${f1(pl)}</b><span>今日の計画</span></div></div></div>
${warn}
<div class="sec">半年のロードマップ</div>
<div class="card">${phases.map((p,i)=>`<div class="ph ${t>=pts[i][0]&&t<pts[i+1][0]?'now':''}"><b>${p[0]}</b><span class="w">${(Math.round(pts[i][1]*10)/10)} → ${(Math.round(pts[i+1][1]*10)/10)} kg</span><p>${p[1]}</p></div>`).join('')}</div>
<div class="sec">今週<small>月曜はじまり</small></div>
<div class="card"><div class="stats" style="margin:0"><div><b>${wo}<span style="font-size:15px;color:var(--mute)"> 回</span></b><span>筋トレ（目標2〜3回）</span></div><div><b>${wa==null?'—':wa.toFixed(1)+'<span style="font-size:15px;color:var(--mute)"> L</span>'}</b><span>水分の平均</span></div><div><b>${wk.filter(k=>days[k].weight!=null).length}<span style="font-size:15px;color:var(--mute)"> 日</span></b><span>体重を測った日</span></div></div></div>
<div class="sec">最近の記録<small>タップで編集</small></div>
${recent.length?`<div class="group">${recent.map(k=>{const d=days[k];return `<button class="li" data-a="goto" data-v="${esc(k)}"><span class="grow">${esc(short(k))}<span class="m">${esc(SHIFTS[d.shift])}・水分 ${(d.water*.25).toFixed(1)}L${d.workout?'・筋トレ':''}</span></span><span class="r">${f1(d.weight)} kg ›</span></button>`}).join('')}</div>`:'<div class="group"><div class="empty">「今日」で体重を入れると、ここに並びます</div></div>'}
<button class="btn" data-a="copy">スプレッドシート用にコピー</button><p class="note" id="copied"></p></div>`;
}
let ro=null;
function drawChart(){
  const s=$('#chart');if(!s)return;const W=s.clientWidth,H=s.clientHeight;if(!W||!H)return;
  const Lm=4,R=30,T=10,B=22,pts=planPts(),sr=series(),end=Math.max(diff(S.start,pts[3][0]),...sr.map(x=>diff(S.start,x[0])),7),beg=Math.min(0,...sr.map(x=>diff(S.start,x[0])));
  const ws=sr.map(x=>x[1]);let lo=Math.floor((Math.min(S.goal,...ws)-1)/5)*5,hi=Math.ceil((Math.max(S.w0,...ws)+.5)/5)*5;
  const X=d=>Lm+(W-Lm-R)*(diff(S.start,d)-beg)/(end-beg),Y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let g='';
  for(let v=lo;v<=hi;v+=5){const y=Y(v).toFixed(1);g+=`<line x1="${Lm}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--sep)" ${v===lo?'':'stroke-dasharray="2 3"'}/><text x="${W-R+6}" y="${+y+4}">${v}</text>`}
  for(let m=0;m<=6;m+=W<400?2:1){const d=addMonths(S.start,m),x=X(d);g+=`<text x="${x.toFixed(1)}" y="${H-5}" text-anchor="${m===0?'start':m===6?'end':'middle'}">${parse(d).getMonth()+1}月</text>`}
  g+=`<polyline points="${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const tx=X(today());if(tx>=Lm&&tx<=W-R)g+=`<line x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${T}" y2="${H-B}" stroke="var(--sep)"/>`;
  if(sr.length){g+=`<polyline points="${sr.map(x=>X(x[0]).toFixed(1)+','+Y(x[1]).toFixed(1)).join(' ')}" fill="none" stroke="var(--purple)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;const l=sr[sr.length-1];g+=`<circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="5" fill="var(--purple)" stroke="var(--card)" stroke-width="2"/>`}
  s.innerHTML=g;
}

function render(){
  const nav=$('#nav');if(mode!=='app'){nav.hidden=true;view.innerHTML=gate();if(ro){ro.disconnect();ro=null}return}nav.hidden=false;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  view.innerHTML=tab==='food'?vFood():tab==='train'?vTrain():tab==='log'?vLog():vToday();
  if(ro){ro.disconnect();ro=null}
  if(tab==='log'){ro=new ResizeObserver(drawChart);ro.observe($('#fig'))}
}
function soft(anchor){
  if(!sheet.hidden||mode!=='app')return;const ae=document.activeElement;if(ae&&ae.tagName==='INPUT'&&view.contains(ae)){pend=true;return}
  let top=null;if(anchor&&anchor.isConnected)top=[anchor.dataset.a,anchor.dataset.v,[...view.querySelectorAll(`[data-a="${anchor.dataset.a}"][data-v="${anchor.dataset.v}"]`)].indexOf(anchor),anchor.getBoundingClientRect().top];
  const y=window.scrollY;render();window.scrollTo(0,y);
  if(top&&top[2]>=0){const el=view.querySelectorAll(`[data-a="${top[0]}"][data-v="${top[1]}"]`)[top[2]];if(el)window.scrollBy(0,el.getBoundingClientRect().top-top[3])}
}
view.addEventListener('focusout',()=>{if(pend){pend=false;setTimeout(()=>soft(),0)}});
view.addEventListener('input',e=>{if(e.target.id==='q'){qText=e.target.value;const lib=$('#lib');if(lib)lib.innerHTML=libHtml()}});
function saveOpen(){try{localStorage.setItem('gp-open',JSON.stringify([...openP]))}catch(e){}}
function twice(b,label){if(b.dataset.c==='1')return true;b.dataset.c='1';b.textContent=label;setTimeout(()=>{if(b.isConnected)delete b.dataset.c},4000);return false}

document.addEventListener('click',e=>{
  const tb=e.target.closest('nav [data-tab]');if(tb){go(tb.dataset.tab);return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='sx')closeSheet();
  else if(a==='sok'&&sheetOk)closeSheetOk(sheetOk);
  else if(a==='settings')openSettings();
  else if(a==='theme'){setTheme(v);sheet.querySelectorAll('[data-a=theme]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v))}
  else if(a==='pw0'||a==='pgoal'){const k=a==='pw0'?'w0':'goal';sheetBack=null;sheet.classList.remove('on');picker(a==='pw0'?'開始体重':'目標体重',weightCols(S[k]),vv=>{const w=toW(vv);if(k==='goal'?w>=S.w0:w<=S.goal){status('目標体重は開始体重より小さくしてください');return}S[k]=w;saveSet();render()},openSettings)}
  else if(a==='login')login();
  else if(a==='reload')location.reload();
  else if(a==='logout'){if(mode==='app'&&!twice(b,'もう一度押すとログアウト'))return;closeSheetQuiet();fb&&fb.AU.signOut(fb.auth)}
  else if(a==='bkdl'){download('減量プラン手帳_バックアップ_'+today()+'.json',JSON.stringify({app:'gp2',version:1,exportedAt:new Date().toISOString(),days,S,TR}));status('バックアップを保存しました')}
  else if(a==='prev'){cur=addDays(cur,-1);render()}
  else if(a==='next'){if(cur<today()){cur=addDays(cur,1);render()}}
  else if(a==='today'){cur=today();render()}
  else if(a==='weight')pickWeight();
  else if(a==='wdel'){setField('weight',null);status('体重を消しました')}
  else if(a==='shift'&&SHIFTS[v]){const d=cleanDay(days[cur]);if(d.shift!==v){d.shift=v;d.rule=false;days[cur]=d;saveDay(cur);soft()}}
  else if(a==='cup'){const i=+v,d=cleanDay(days[cur]);setField('water',d.water===i+1?i:i+1)}
  else if(a==='chk'){const d=cleanDay(days[cur]);setField(v,!d[v])}
  else if(a==='goto'&&isDate(v)){cur=v;go('today')}
  /* training */
  else if(a==='flt'){flt=v;soft(b)}
  else if(a==='favonly'){favOnly=!favOnly;soft(b)}
  else if(a==='part'&&PARTS[v]){if(openP.has(v))openP.delete(v);else openP.add(v);saveOpen();soft(b)}
  else if(a==='allparts'){if(openP.size>=Object.keys(PARTS).length)openP.clear();else openP=new Set(Object.keys(PARTS));saveOpen();soft(b)}
  else if(a==='toggle'&&L[v]){const i=TR.items.findIndex(x=>x.id===v);if(i>=0)TR.items.splice(i,1);else{addItems([{id:v}]);status(L[v].n+'を追加しました')}saveTR();soft(b)}
  else if(a==='fav'&&L[v]){TR.favs=TR.favs.includes(v)?TR.favs.filter(x=>x!==v):[...TR.favs,v];saveTR();soft(b)}
  else if(a==='addset'){addItems(LIB.filter(x=>x[8]===v).map(x=>({id:x[0]})));window.scrollTo(0,0);render();status('メニューに追加しました')}
  else if(a==='mset')pickItem(v);
  else if(a==='mdel'){TR.items=TR.items.filter(x=>x.id!==v);saveTR();soft()}
  else if(a==='mclear'){if(!twice(b,'もう一度押すと全部外す'))return;TR.items=[];saveTR();soft()}
  else if(a==='mdone'&&known(v)){const t=today(),d=cleanDay(days[t]),it=TR.items.find(x=>x.id===v);if(d.log.some(x=>x.id===v))d.log=d.log.filter(x=>x.id!==v);else if(it)d.log.push({...it});if(d.log.length)d.workout=true;days[t]=d;saveDay(t);soft(b)}
  else if(a==='tplsave'){if(TR.items.length)openTplSave(TR.items)}
  else if(a==='tname'){const el=$('#tn');if(el)el.value=v}
  else if(a==='tplok')saveTpl();
  else if(a==='tpl')openTpl(v);
  else if(a==='tpluse'||a==='tpladd'){const t=TR.tpls.find(x=>x.id===v);if(t){addItems(t.items,a==='tpluse');closeSheet();window.scrollTo(0,0);status('「'+t.name+'」を'+(a==='tpluse'?'呼び出しました':'追加しました'))}}
  else if(a==='tplover'){const t=TR.tpls.find(x=>x.id===v);if(t&&TR.items.length){if(!twice(b,'もう一度押すと上書き'))return;t.items=cleanItems(TR.items);saveTR();closeSheet();status('「'+t.name+'」を上書きしました')}}
  else if(a==='tpldel'){if(!twice(b,'もう一度押すと削除'))return;TR.tpls=TR.tpls.filter(x=>x.id!==v);saveTR();closeSheet();status('テンプレを削除しました')}
  else if(a==='hist'&&days[v])openHist(v);
  else if(a==='histmore'){histN+=10;soft()}
  else if((a==='hreplay'||a==='hadd')&&days[v]){addItems(days[v].log,a==='hreplay');closeSheet();window.scrollTo(0,0);status(a==='hreplay'?'メニューを再現しました':'メニューに追加しました')}
  else if(a==='hsave'&&days[v]){const items=days[v].log;sheet.classList.remove('on');openTplSave(items)}
  else if(a==='custom')openCustom();
  else if(a==='cd'){cDraft[b.dataset.k]=v;sheet.querySelectorAll(`[data-a=cd][data-k="${b.dataset.k}"]`).forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v))}
  else if(a==='cadd')addCustom();
  else if(a==='cdel'&&L[v]&&L[v].mine){if(!twice(b,'削除'))return;TR.custom=TR.custom.filter(x=>x.id!==v);TR.items=TR.items.filter(x=>x.id!==v);TR.favs=TR.favs.filter(x=>x!==v);TR.tpls.forEach(t=>{t.items=t.items.filter(x=>x.id!==v)});buildL();saveTR();soft()}
  else if(a==='copy'){const ks=Object.keys(days).filter(isDate).sort();const txt=['日付\t勤務\t体重\t水分(L)\t睡眠\tタンパク質\tお菓子なし\t勤務ルール\t筋トレ\tやった種目'].concat(ks.map(k=>{const d=days[k];return [k,SHIFTS[d.shift],d.weight??'',(d.water*.25).toFixed(2),...['sleep','protein','sweets','rule','workout'].map(x=>d[x]?'○':''),d.log.map(x=>ex(x.id).n+' '+fmtItem(x)).join(' / ')].join('\t')})).join('\n');const out=$('#copied'),ng=()=>{out.textContent='コピーできませんでした。'};try{navigator.clipboard.writeText(txt).then(()=>{out.textContent=ks.length+'日分をコピーしました。スプレッドシートのA1に貼り付けてください。'},ng)}catch(err){ng()}}
});
document.addEventListener('change',e=>{if(e.target.id==='bkf'&&e.target.files&&e.target.files[0]){const f=e.target.files[0];f.text().then(t=>{const n=restore(JSON.parse(t));closeSheet();status(n+'日分の記録を復元しました')}).catch(err=>status('復元できませんでした：'+String(err&&err.message||err).slice(0,40),true));return}
  if(e.target.id==='sd'){const v=e.target.value;if(isDate(v)){S.start=v;saveSet();render();status('開始日を変更しました')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet()});
const TABS=['today','food','train','log'];
function go(t){tab=t;if(location.hash!=='#'+t){try{history.replaceState(null,'','#'+t)}catch(err){try{location.hash=t}catch(e2){}}}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h)&&h!==tab){tab=h;render()}});
{const h=location.hash.slice(1);if(TABS.includes(h))tab=h}

buildL();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
let dayNow=today();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const t=today();if(t!==dayNow){if(cur===dayNow)cur=t;dayNow=t;soft()}}else flushAll()});
window.addEventListener('pagehide',flushAll);
boot();
}
</script>
